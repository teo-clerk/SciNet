[project]
name = "scinet-backend"
version = "0.1.0"
description = "SciNet — local privacy-first scientific paper map"
requires-python = ">=3.12,<3.13"
dependencies = [
    # api
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    # persistence
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "sqlite-vec>=0.1.9",
    # ingestion / parsing (tier 0)
    "watchdog>=5.0.0",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
    "python-docx>=1.1.0",
    # projection / clustering
    "numpy>=1.26,<3",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "umap-learn>=0.5.7",
    "hdbscan>=0.8.40",
    "joblib>=1.4.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
# `uv run scinet-stop` from backend/. The logic lives in the package so it is
# importable and testable; scripts/stop.sh and scripts/stop.py wrap it.
scinet-stop = "app.cli.stop:main"

[project.optional-dependencies]
# Heavy GPU stack — installed deliberately at M1 (tier 1) / M2 (embeddings).
#   uv sync --extra gpu
gpu = [
    "torch>=2.4.0",
    "sentence-transformers>=3.1.0",
    "marker-pdf>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
